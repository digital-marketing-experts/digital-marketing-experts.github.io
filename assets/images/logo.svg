<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="logo-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logo-emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="logo-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Abstract Growth Nodes Mark -->
  <g transform="translate(10, 10)">
    <!-- Node 1 (Center Top) -->
    <circle cx="30" cy="12" r="7" fill="url(#logo-cyan-grad)"/>
    <!-- Node 2 (Left Bottom) -->
    <circle cx="12" cy="48" r="7" fill="url(#logo-emerald-grad)"/>
    <!-- Node 3 (Right Bottom) -->
    <circle cx="48" cy="48" r="7" fill="url(#logo-purple-grad)"/>
    <!-- Center Core Node -->
    <circle cx="30" cy="32" r="5" fill="#ffffff"/>

    <!-- Connecting Dynamic Line Vectors -->
    <line x1="30" y1="12" x2="30" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="48" x2="30" y2="32" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="48" x2="30" y2="32" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="48" x2="48" y2="48" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Typography -->
  <text x="80" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="-0.3">DIGITAL MARKETING</text>
  <text x="80" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="3.5">EXPERTS</text>
  <rect x="180" y="44" width="132" height="15" rx="3" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
  <text x="246" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="0.8">BY ADRIAN MERCER</text>
</svg>